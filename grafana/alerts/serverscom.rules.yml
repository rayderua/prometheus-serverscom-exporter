# Generated alert rules of prometheus-serverscom-exporter.
# The rule files in this directory share one definition; change them together.
# Prometheus / vmalert rule file.
groups:
- name: serverscom-hosts
  interval: 1m
  rules:
  - alert: ServerscomHostPoweredOff
    expr: serverscom_host_powered_on == 0 unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Server {{ $labels.title }} is powered off
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) has not
        reported power_status powered_on for 10 minutes. Set the Servers.com label monitoring=off on servers that are off
        on purpose.
  - alert: ServerscomHostNotOperational
    expr: serverscom_host_operational_status{status!="normal"} == 1 unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: Server {{ $labels.title }} is {{ $labels.status }}
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) reports
        operational_status {{ $labels.status }} instead of normal.
  - alert: ServerscomHostNotActive
    expr: serverscom_host_status{status!="active"} == 1 unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    for: 1h
    labels:
      severity: info
    annotations:
      summary: Server {{ $labels.title }} is {{ $labels.status }}
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) has had
        the lifecycle status {{ $labels.status }} for an hour (e.g. a reinstall or release in progress).
  - alert: ServerscomHostReleaseScheduled
    expr: (serverscom_host_scheduled_release_timestamp_seconds - time()) < 7 * 86400
    labels:
      severity: warning
    annotations:
      summary: Server {{ $labels.title }} is scheduled to be released
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) will be
        released in {{ $value | humanizeDuration }}. Abort the release in the portal if it is unexpected.
  - alert: ServerscomHostRemoved
    expr: |-
      serverscom_host_info offset 1h unless on (host_id) serverscom_host_info
      and on () (count(serverscom_host_info) > 0)
    labels:
      severity: warning
    annotations:
      summary: Server {{ $labels.title }} disappeared from the account
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) was in
        the account an hour ago and is not any more. The alert resolves by itself after an hour.
  - alert: ServerscomHostDrivesMissing
    expr: |-
      # Counted per host_id: a renamed server or one moved to another rack keeps
      # its drives. Title, location and rack come from the current server list.
      (
        (
          count by (host_id) (serverscom_host_drive_capacity)
          or 0 * count by (host_id) (serverscom_host_drive_capacity offset 1d)
        )
        < count by (host_id) (serverscom_host_drive_capacity offset 1d)
      )
      * on (host_id) group_left (title, location, rack)
        topk by (host_id) (1, max by (host_id, title, location, rack) (serverscom_host_info))
      unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    labels:
      severity: warning
    annotations:
      summary: Server {{ $labels.title }} has fewer drives than a day ago
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) has {{
        $value }} drives installed, fewer than a day ago.
- name: serverscom-power-network
  interval: 1m
  rules:
  - alert: ServerscomPowerFeedDown
    expr: serverscom_host_power_feed_up == 0 unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Power feed {{ $labels.feed }} of {{ $labels.title }} is down
      description: 'Power feed {{ $labels.feed }} of server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location
        }} / {{ $labels.rack }}) is off: the server has lost power redundancy.'
  - alert: ServerscomUplinkDisaggregated
    expr: serverscom_host_uplink_redundant == 1 and serverscom_host_uplink_aggregated == 0 unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.uplink }} uplink of {{ $labels.title }} is not aggregated'
      description: 'The redundant {{ $labels.uplink }} uplink of server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location
        }} / {{ $labels.rack }}) was split with the disaggregated_{{ $labels.uplink }}_ports feature: its ports are no longer
        in a LAG and have no redundancy.'
  - alert: ServerscomFeatureStuck
    expr: serverscom_host_feature_status{status=~".+ation"} == 1
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Feature {{ $labels.feature }} of {{ $labels.title }} is stuck in {{ $labels.status }}
      description: Feature {{ $labels.feature }} of server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location
        }} / {{ $labels.rack }}) has been in the transitional status {{ $labels.status }} for 30 minutes.
  - alert: ServerscomOOBPublicAccessEnabled
    expr: serverscom_host_feature_enabled{feature="oob_public_access"} == 1 unless on (host_id) serverscom_host_labels{label_monitoring="off"}
    labels:
      severity: warning
    annotations:
      summary: Public OOB access is enabled on {{ $labels.title }}
      description: 'The oob_public_access feature is active on server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location
        }} / {{ $labels.rack }}): its OOB interface is reachable from the internet.'
  - alert: ServerscomL2SegmentNotActive
    expr: serverscom_l2_segment_info{status!="active"} == 1
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: L2 segment {{ $labels.segment }} is {{ $labels.status }}
      description: L2 segment {{ $labels.segment }} ({{ $labels.segment_id }}, {{ $labels.location_group }}) has had the status
        {{ $labels.status }} for 15 minutes.
  - alert: ServerscomL2MemberNotActive
    expr: serverscom_l2_segment_member_info{status!="active"} == 1
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.title }} is {{ $labels.status }} in L2 segment {{ $labels.segment }}'
      description: Server {{ $labels.title }} ({{ $labels.host_id }}, {{ $labels.location }} / {{ $labels.rack }}) has had
        the status {{ $labels.status }} in L2 segment {{ $labels.segment }} for 15 minutes.
- name: serverscom-exporter
  interval: 1m
  rules:
  - alert: ServerscomExporterAbsent
    expr: absent(serverscom_exporter_build_info)
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Servers.com exporter metrics are missing
      description: 'No serverscom_exporter_build_info for 10 minutes: the exporter is down or not scraped, so all other Servers.com
        alerts are blind.'
  - alert: ServerscomExporterDataStale
    expr: |-
      (
        time() - label_replace(serverscom_exporter_last_refresh_success_timestamp_seconds, "loop", "$1", "resource", "(.*)")
      )
      > ignoring (resource) 3 * (serverscom_exporter_refresh_interval_seconds > 0)
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Servers.com {{ $labels.loop }} data is stale
      description: The exporter has not refreshed {{ $labels.loop }} for {{ $value | humanizeDuration }}, more than three
        refresh intervals. Check the exporter log, API errors and the request budget.
  - alert: ServerscomExporterRefreshErrors
    expr: increase(serverscom_exporter_refresh_errors_total[30m]) > 0
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Servers.com exporter fails to refresh {{ $labels.resource }}
      description: Refreshing {{ $labels.resource }} has been failing for 30 minutes; cached data is kept. See the exporter
        log for the failing requests.
  - alert: ServerscomAPIAuthFailed
    expr: sum by (job, instance) (increase(serverscom_api_requests_total{code=~"401|403"}[10m])) > 0
    labels:
      severity: critical
    annotations:
      summary: Servers.com API rejects the exporter token
      description: 'The Servers.com API answered 401/403 {{ $value }} times in 10 minutes: the token is invalid, expired or
        lacks permissions. No data is refreshed.'
  - alert: ServerscomAPIServerErrors
    expr: sum by (job, instance) (increase(serverscom_api_requests_total{code=~"5..|error"}[15m])) > 5
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Servers.com API requests are failing
      description: '{{ $value }} API requests failed with 5xx or network errors in 15 minutes.'
  - alert: ServerscomExporterBudgetExhausted
    expr: serverscom_api_budget_exhausted == 1
    labels:
      severity: warning
    annotations:
      summary: Servers.com exporter used up its hourly request budget
      description: The exporter used up --api.requests-per-hour and waits for the hourly reset; data gets stale meanwhile.
        Compare serverscom_api_requests_per_hour_recommended with the budget.
  - alert: ServerscomExporterDemandExceedsBudget
    expr: |-
      serverscom_exporter_refresh_interval_stretch_factor > 1
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Servers.com exporter refresh intervals are stretched to fit its budget
      description: The configured refresh intervals need more than 80% of --api.requests-per-hour, so the exporter runs them {{ $value | humanize }} times less often. Raise the budget to serverscom_api_requests_per_hour_recommended or the intervals.
  - alert: ServerscomExporterIntervalsTooShort
    expr: |-
      sum by (job, instance) (
        serverscom_exporter_requests_per_hour_estimated
        * serverscom_exporter_refresh_interval_seconds / serverscom_exporter_refresh_interval_configured_seconds
      )
      > on (job, instance) 0.8 * (serverscom_api_ratelimit_limit - serverscom_api_ratelimit_reserve)
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Servers.com exporter refresh intervals are too short for the account limit
      description: The configured refresh intervals need about {{ $value | humanize }} requests per hour, more than the account limit leaves for the exporter even with the largest budget; they are stretched. Raise the intervals.
  - alert: ServerscomAPIRateLimitLow
    expr: |-
      serverscom_api_ratelimit_remaining <= 1.5 * serverscom_api_ratelimit_reserve
      and serverscom_api_ratelimit_limit > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Servers.com account is close to its API rate limit
      description: Only {{ $value }} account-wide API requests are left in the current window. The exporter pauses at its
        reserve; other API users (Terraform, CLI) may get 429 responses.
