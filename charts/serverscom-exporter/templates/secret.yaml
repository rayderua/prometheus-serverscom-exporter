{{- if not .Values.apiToken.existingSecret }}
{{- if not .Values.apiToken.value }}
{{- fail "Set apiToken.existingSecret or apiToken.value" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serverscom-exporter.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "serverscom-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.apiToken.secretKey }}: {{ .Values.apiToken.value | b64enc | quote }}
{{- end }}
{{- if and .Values.webConfig.enabled (not .Values.webConfig.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "serverscom-exporter.webConfigSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "serverscom-exporter.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.webConfig.secretKey }}: {{ toYaml .Values.webConfig.config | b64enc | quote }}
{{- end }}
