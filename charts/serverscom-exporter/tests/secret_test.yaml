suite: secrets
templates:
  - secret.yaml
tests:
  - it: fails without a token
    asserts:
      - failedTemplate:
          errorMessage: Set apiToken.existingSecret or apiToken.value

  - it: stores the token
    set:
      apiToken.value: test
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-serverscom-exporter-token
      - equal:
          path: data.token
          value: dGVzdA==

  - it: creates nothing for an existing Secret
    set:
      apiToken.existingSecret: my-token
    asserts:
      - hasDocuments:
          count: 0

  - it: stores the web config
    set:
      apiToken.existingSecret: my-token
      webConfig:
        enabled: true
        config:
          basic_auth_users:
            prometheus: hash
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-serverscom-exporter-web-config
      - equal:
          path: data["web-config.yml"]
          decodeBase64: true
          value: |-
            basic_auth_users:
              prometheus: hash

  - it: does not store an existing web config
    set:
      apiToken.existingSecret: my-token
      webConfig.enabled: true
      webConfig.existingSecret: my-web-config
    asserts:
      - hasDocuments:
          count: 0
