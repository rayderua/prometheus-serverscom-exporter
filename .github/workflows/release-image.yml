name: Release image

# Image releases are made from tags vX.Y.Z (or vX.Y.Z-rc.N) on commits of the
# main branch: the multi-arch image, and binaries attached to the GitHub
# release. Charts are released separately, see release-chart.yml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/prometheus-serverscom-exporter
  GO_VERSION: "1.27"

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag must point to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch, nothing is released"
            exit 1
          fi
      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Go tests
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: src/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  image:
    name: Docker image
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: src/go.sum
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build date
        id: date
        run: echo "date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Nothing is pushed unless the image passes the smoke test.
      - name: Load linux/amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          load: true
          tags: prometheus-serverscom-exporter:smoke
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
            BRANCH=main
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
      - name: Smoke test against the mock API
        working-directory: src
        run: test/smoke.sh prometheus-serverscom-exporter:smoke
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z, X.Y and latest; pre-releases (X.Y.Z-rc.N) only get their own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
            BRANCH=main
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Binaries
    needs: [check, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: src/go.sum
      - name: Build
        run: make -C .. dist VERSION="${{ needs.check.outputs.version }}" BRANCH=main
      - name: Smoke test of the linux/amd64 binary
        run: |
          tar -xzf dist/serverscom-exporter-*.linux-amd64.tar.gz -C "$RUNNER_TEMP"
          EXPORTER_BIN=$(echo "$RUNNER_TEMP"/serverscom-exporter-*.linux-amd64/serverscom-exporter) test/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: src/dist/
          retention-days: 1

  release:
    name: GitHub release
    needs: [check, image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: dist
      - name: Create release
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --notes-file notes.md)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          # Notes start at the previous image release, not at a chart release.
          if prev=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null); then
            flags+=(--notes-start-tag "$prev")
          fi
          printf 'Image: `%s:%s`\n\nBinaries for linux and darwin (amd64, arm64) are attached, checksums in `sha256sums.txt`.\n' \
            "$IMAGE" "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
